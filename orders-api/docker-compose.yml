# Run the API and a local PostgreSQL:   docker compose up --build
# Then open http://localhost:8080/docs
services:
  db:
    image: public.ecr.aws/docker/library/postgres:16
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 2s
      retries: 15

  api:
    build: .
    environment:
      APP_ENV: local
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: orders
      DB_USERNAME: orders
      DB_PASSWORD: orders
      DB_SSLMODE: disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
